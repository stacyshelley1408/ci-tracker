defaults:
  active: true
  significance_threshold: 4
  watch_keywords: []
  signals:
    messaging_diffs:
      alert: weekly
      include_in_digest: true
    job_postings:
      alert: weekly
      include_in_digest: true
      filters:
        departments: []
        seniority: []
    news:
      alert: daily
      include_in_digest: true
    reviews:
      alert: weekly
      include_in_digest: true
      platforms:
        - g2
        - gartner_peer_insights
        - capterra
        - trustradius
        - peerspot
        - spiceworks
    reddit:
      alert: daily
      include_in_digest: true
      subreddits:
        - msp
        - sysadmin
        - cybersecurity
        - networking
        - riskmanagement
        - compliance
      search_terms: []

companies:
