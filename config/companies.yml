defaults:
  active: true
  significance_threshold: 4
  watch_keywords: []
  signals:
    messaging_diffs:
      alert: weekly
      include_in_digest: true
    job_postings:
      alert: weekly
      include_in_digest: true
      filters:
        departments: []
        seniority: []
    news:
      alert: daily
      include_in_digest: true
    reviews:
      alert: weekly
      include_in_digest: true
      platforms:
        - g2
        - gartner_peer_insights
        - capterra
        - trustradius
        - peerspot
        - spiceworks
    reddit:
      alert: daily
      include_in_digest: true
      subreddits:
        - msp
        - sysadmin
        - cybersecurity
        - networking
        - riskmanagement
        - compliance
      search_terms: []

# Competitor set mirrors Terrain's data/competitors/ (Archer IRM is Terrain's
# customer, not a competitor, so it is not tracked here). Terrain competitors:
# servicenow-grc, metricstream, onetrust-grc, ibm-openpages, optro, logicgate.
companies:
  - name: ServiceNow GRC
    base_url: https://www.servicenow.com
    active: true
    significance_threshold: 3
    watch_keywords:
      - GRC
      - risk
      - compliance
      - IRM
      - AI
      - pricing
      - acquisition
    signals:
      reviews:
        platforms:
          - g2
          - gartner_peer_insights
          - trustradius
          - peerspot
    pages:
      - url: /solutions/governance-risk-compliance.html
      - url: /products/governance-risk-and-compliance.html
      - url: /products/integrated-risk-management.html
    careers_url: https://www.servicenow.com/company/careers.html
    news_feeds:
      - https://www.servicenow.com/blogs/feed/
    review_urls:
      g2: https://www.g2.com/products/servicenow-risk-and-compliance/reviews
      gartner_peer_insights: https://www.gartner.com/reviews/market/integrated-risk-management/vendor/servicenow
      trustradius: https://www.trustradius.com/products/servicenow-grc/reviews
      peerspot: https://www.peerspot.com/products/servicenow-grc-reviews

  - name: MetricStream
    base_url: https://www.metricstream.com
    active: true
    significance_threshold: 4
    watch_keywords:
      - AI
      - GRC
      - risk
      - compliance
      - funding
      - acquisition
    signals:
      reviews:
        platforms:
          - g2
          - gartner_peer_insights
          - trustradius
          - peerspot
    pages:
      - url: /
      - url: /products/
      - url: /solutions/
    careers_url: https://www.metricstream.com/company/careers.htm
    news_feeds:
      - https://www.metricstream.com/insights/feed/
    review_urls:
      g2: https://www.g2.com/products/metricstream/reviews
      gartner_peer_insights: https://www.gartner.com/reviews/market/integrated-risk-management/vendor/metricstream
      trustradius: https://www.trustradius.com/products/metricstream/reviews
      peerspot: https://www.peerspot.com/products/metricstream-reviews

  # Optro = AuditBoard rebrand (see Terrain data/competitors/optro.json). The live
  # site and review listings are still served on the auditboard.com domain and
  # auditboard review slugs; a redirect/relaunch to optro.com will surface as a
  # high-signal messaging diff when it lands.
  - name: Optro
    base_url: https://www.auditboard.com
    active: true
    significance_threshold: 3
    watch_keywords:
      - AI
      - GRC
      - risk
      - compliance
      - funding
      - Optro
      - rebrand
      - acquisition
    signals:
      reviews:
        platforms:
          - g2
          - gartner_peer_insights
          - trustradius
          - capterra
    pages:
      - url: /
      - url: /platform/
      - url: /pricing/
    careers_url: https://www.auditboard.com/company/careers/
    news_feeds:
      - https://www.auditboard.com/blog/feed/
    review_urls:
      g2: https://www.g2.com/products/auditboard/reviews
      gartner_peer_insights: https://www.gartner.com/reviews/market/integrated-risk-management/vendor/auditboard
      trustradius: https://www.trustradius.com/products/auditboard/reviews
      capterra: https://www.capterra.com/p/auditboard/

  - name: OneTrust GRC
    base_url: https://www.onetrust.com
    active: true
    significance_threshold: 4
    watch_keywords:
      - GRC
      - risk
      - compliance
      - AI
