      gartner_peer_insights: https://www.gartner.com/reviews/market/integrated-risk-management/vendor/onetrust
      trustradius: https://www.trustradius.com/products/onetrust/reviews

  - name: IBM OpenPages
    base_url: https://www.ibm.com
